[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # bandit
    "N",   # pep8-naming
]
ignore = [
    "S101",  # assert используется в тестах
    "S105",  # hardcoded password — для тестов
    "B008",  # function calls in default arguments (Django Ninja паттерн)
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S", "N"]
"backend/**/migrations/**" = ["E501", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "config.settings.local"

[tool.pytest.ini_options]
pythonpath = ["backend"]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--keepdb",
    "-v",
]
markers = [
    "slow: slow integration tests",
    "vault: tests requiring Vault",
]

[tool.coverage.run]
source = ["backend"]
omit = ["*/migrations/*", "*/tests/*", "manage.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
