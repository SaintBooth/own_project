worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Безопасность ────────────────────────────────────────────────────
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── Rate limiting (ADR-009) ─────────────────────────────────────────
    # map-блок вместо if (is evil)
    map $http_authorization $rate_zone {
        ~^Api-Key  "api_agent";
        default    "api_buyer";
    }

    limit_req_zone $binary_remote_addr zone=api_buyer:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api_agent:10m rate=300r/m;
    limit_req_zone $binary_remote_addr zone=general:10m  rate=120r/m;

    # ── Логирование ─────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ── Сжатие ──────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # ── Upstream ────────────────────────────────────────────────────────
    upstream django {
        server web:8000;
    }

    upstream nextjs {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # ── Django API ──────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_buyer burst=20 nodelay;

            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Django Admin ────────────────────────────────────────────────
        location /admin/ {
            limit_req zone=general burst=5 nodelay;

            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Next.js Frontend ────────────────────────────────────────────
        location / {
            proxy_pass http://nextjs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Health check (без rate limit) ────────────────────────────────
        location /api/v1/health/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
        }
    }
}
