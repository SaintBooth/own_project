; ВНИМАНИЕ: В dev edoburu/pgbouncer генерирует конфиг из env vars (DB_HOST, DB_USER, ...).
; Этот файл — РЕФЕРЕНС для ручного деплоя / production (не монтируется в dev-контейнер).

[databases]
; Маршрут: PgBouncer → PostgreSQL напрямую
prompt_marketplace = host=db port=5432 dbname=prompt_marketplace

[pgbouncer]
; Режим пула: transaction (обязательно, PgBouncer transaction mode — ADR)
pool_mode = transaction

; Сетевые настройки
listen_addr = 0.0.0.0
listen_port = 5432

; Файл с пользователями и хешами паролей
auth_file = /etc/pgbouncer/userlist.txt
; plain — plaintext пароли в userlist.txt (только dev). Production: md5 или scram-sha-256
auth_type = plain

; Пул
max_client_conn = 200
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3

; Логирование (минимальное для production)
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; Таймауты
server_idle_timeout = 600
client_idle_timeout = 0
query_timeout = 0

; Административный доступ
admin_users = postgres
stats_users = postgres

; TLS (в dev отключён, в production включить)
; server_tls_sslmode = require
; server_tls_ca_file = /etc/ssl/certs/ca-certificates.crt
